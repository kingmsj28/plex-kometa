  ##################################################
  # Cowboy Bebop
  ##################################################
  #
  # APPBOX RELEASE-SPECIFIC COMPLETE METADATA FILE
  #
  # WHY THIS SHOW HAS ITS OWN FILE:
  #
  # The AppBox Cowboy Bebop release uses mixed TVDB
  # ordering:
  #   Season 1 = TVDB DVD Order
  #   Specials = TVDB Aired Order
  #
  # Plex must use TVDB DVD Order so the 26 main
  # episodes match the actual AppBox files.
  #
  # That makes Plex assign the wrong TVDB metadata
  # to the three Specials that exist on the AppBox.
  # This file therefore contains BOTH:
  #   - All Cowboy Bebop artwork
  #   - The AppBox-specific Specials corrections
  #
  # Cowboy Bebop must NOT also be defined in the
  # main anime-metadata.yml while this file is loaded.
  # Testing confirmed that loading the same TVDB ID
  # (76885) from two metadata files causes Kometa to
  # error.
  #
  # Verified AppBox files:
  #   S00E01 = Mish-Mash Blues
  #   S00E03 = Knockin' on Heaven's Door
  #   S00E04 = Ein's Summer Vacation
  #
  # IMPORTANT:
  # Re-verify these three Specials if AppBox ever
  # replaces or renumbers the underlying release.
  #
  # This file is APPBOX-SPECIFIC and should not be
  # loaded on another Plex server without first
  # verifying that server's Cowboy Bebop ordering.
  #
  ##################################################

